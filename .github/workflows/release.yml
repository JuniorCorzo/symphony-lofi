name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install libmpv dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev gcc

      - name: Build Linux Binary
        run: |
          go build -ldflags="-s -w" -o symphony-lofi-linux-amd64 ./cmd/symphony-lofi
          tar -czvf symphony-lofi-linux-amd64.tar.gz symphony-lofi-linux-amd64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: symphony-lofi-linux-amd64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-mpv

      - name: Build Windows Binary
        shell: msys2 {0}
        run: |
          go build -ldflags="-s -w" -o symphony-lofi.exe ./cmd/symphony-lofi
          cp /mingw64/bin/*mpv*.dll ./ 2>/dev/null || true
          7z a symphony-lofi-windows-amd64.zip symphony-lofi.exe *.dll

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: symphony-lofi-windows-amd64.zip

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-binary

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            symphony-lofi-linux-amd64.tar.gz
            symphony-lofi-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
